name: Contributor License Agreement (CLA)

on:
  pull_request_target:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

jobs:
  cla:
    runs-on: ubuntu-latest
    if: |
      (
        (github.event.issue.pull_request && !github.event.issue.pull_request.merged_at && contains(github.event.comment.body, 'signed'))
        || (github.event.pull_request && !github.event.pull_request.merged)
      ) && secrets.CLA_TOKEN != ''
    steps:
      - name: Check for CLA token
        if: ${{ secrets.CLA_TOKEN == '' }}
        run: |
          echo "CLA_TOKEN is missing. Skipping CLA check."
          exit 0
      - name: Run CLA Action
        if: ${{ secrets.CLA_TOKEN != '' }}
        uses: Shopify/shopify-cla-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cla-token: ${{ secrets.CLA_TOKEN }}
